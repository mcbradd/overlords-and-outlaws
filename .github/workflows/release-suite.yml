name: Release suite
on:
  push:
    branches: [prod]
  pull_request:
    branches: [main, prod]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release-suite:
    name: release-suite
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chrome
      - run: npm run test:release
      - name: Preserve reports and screenshots even when a check fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence-${{ github.sha }}
          path: artifacts/
          retention-days: 30
